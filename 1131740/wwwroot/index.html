<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicShop數位商城 - 首頁</title>
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Microsoft JhengHei', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .welcome-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            padding: 40px 30px;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

   
        .shop-logo {
            width: 120px; 
            height: auto; 
            margin-bottom: 20px; 
            border-radius: 10px; 
        }


        .shop-title {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
        }


        .developer-badge {
            background-color: #e3f2fd;
            color: #0d6efd;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 30px;
            font-size: 16px;
        }


        .enter-btn {
            display: inline-block;
            background-color: #0d6efd;
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
        }

            .enter-btn:hover {
                background-color: #0b5ed7;
            }
    </style>
</head>
<body>

    <div class="welcome-card">

        <img src="/pictures/17403678683551176BW.jpg" alt="MagicShop Logo" class="shop-logo">

        <h1 class="shop-title">MagicShop數位商城</h1>

        <div class="developer-badge">
            學號 1131740
        </div>

        <div>
            <a href="/Account/Login" class="enter-btn">
                進入商店
            </a>
        </div>
    </div>

</body>
</html>
